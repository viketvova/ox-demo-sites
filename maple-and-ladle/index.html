<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maple &amp; Ladle — home-cooked dinners in St. John's</title>
  <meta name="description" content="Two chefs, one home kitchen. Fresh dinners cooked today and delivered across St. John's metro, Newfoundland. Order this week's menu." />
  <style>
    :root, .sw-root {
      --sw-bg: #F6EEDF;
      --sw-ink: #2E2A26;
      --sw-ink-soft: #7A6F63;
      --sw-accent: #C8502E;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Maple & Ladle', href: '#top' },
      cta: { label: 'Order dinner', href: 'menu.html' },
      hint: 'scroll to fly in',
      diveScroll: 1.3,
      sections: [
        {
          id: 'market', label: 'The Market', still: 'assets/scene1-ai.jpg', clip: 'assets/vid/dive1.mp4', accent: '#6E9455',
          eyebrow: "St. John's, Newfoundland",
          title: 'It starts at the market.',
          body: 'Every week we shop the way you would — fresh produce, honest suppliers, nothing you can\'t pronounce. Then we cook it the same day.',
          tags: ['Local produce', 'Weekly menu']
        },
        {
          id: 'kitchen', label: 'The Kitchen', still: 'assets/scene2-ai.jpg', clip: 'assets/vid/dive2.mp4', accent: '#C8502E',
          eyebrow: 'The home kitchen',
          title: 'Two chefs. One kitchen.',
          body: 'No ghost kitchen, no factory line — a real home kitchen, cooked by the two of us. Food-handler certified, health-inspected, small batches.',
          tags: ['Cooked today', 'Food-handler certified']
        },
        {
          id: 'pack', label: 'Taste & Pack', still: 'assets/scene3-ai.jpg', clip: 'assets/vid/dive3.mp4', accent: '#D98E3F',
          eyebrow: 'Quality check',
          title: 'Tasted twice. Packed warm.',
          body: 'Every dish leaves only after we\'ve tasted it — boxed, sealed and labelled with everything inside, allergens included.',
          tags: ['Allergen labels', 'No freezers']
        },
        {
          id: 'delivery', label: 'Delivery', still: 'assets/scene4-ai.jpg', clip: 'assets/vid/dive4.mp4', accent: '#4A7CA5',
          eyebrow: 'Out the door',
          title: 'Warm at your door.',
          body: 'Insulated bags and careful routes across St. John\'s metro. Dinner arrives inside your delivery window — still steaming.',
          tags: ['Delivery windows', 'Free over $60']
        },
        {
          id: 'table', label: 'The Table', still: 'assets/scene5-ai.jpg', clip: 'assets/vid/dive5.mp4', accent: '#9B6B7A',
          eyebrow: 'At your table',
          title: 'Where dinner feels like home.',
          body: 'Reheat in ten minutes or serve right away — plates the whole family actually agrees on.',
          tags: ['Family-size trays', 'Reheat-friendly']
        },
        {
          id: 'dish', label: "This Week's Menu", still: 'assets/scene6-ai.jpg', clip: 'assets/vid/dive6.mp4', accent: '#C8502E',
          eyebrow: 'Ready when you are',
          title: "This week's menu is ready.",
          cta: {
            primary: { label: 'Order dinner', href: 'menu.html' },
            secondary: { label: 'Back to top', href: '#top' }
          }
        }
      ],
      connectors: []
    });
  </script>
<script>
setTimeout(function () {
  [1,2,3,4,5,6].forEach(function (n) {
    fetch('assets/vid/dive' + n + '.mp4').catch(function () {});
  });
}, 1500);
</script>
</body>
</html>
